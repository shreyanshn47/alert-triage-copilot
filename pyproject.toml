[project]
name = "alert-triage-copilot"
version = "0.1.0"
description = "RAG-based security alert triage with measured evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "anthropic>=1.0",
]

[project.optional-dependencies]
# Local embedding model (pulls in torch). Kept out of the base install so the API image and
# plain unit tests stay light; steps 3 to 6 install it.
retrieval = [
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
]
dev = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test data includes realistic log lines that are clearer unbroken.
"tests/*" = ["E501"]
# The download manifest is a table of long URL paths.
"data/fetch_otrf.py" = ["E501"]
# Payload and command-line literals are clearer unbroken.
"data/make_injection.py" = ["E501"]
